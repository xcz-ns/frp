name: 构建镜像并发布到阿里云

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: true
        default: 'test'

permissions:
  contents: read

jobs:
  image:
    name: 从Dockerfile和二进制文件构建镜像
    runs-on: ubuntu-latest
    steps:
      # 环境准备
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: 设置QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 获取镜像标签名
      - name: 获取镜像标签名
        run: |
          if [ x${{ github.event.inputs.tag }} == x"" ]; then
            echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 准备镜像标签
      - name: 准备镜像标签
        run: |
          echo "DOCKERFILE_FRPC_PATH=dockerfiles/Dockerfile-for-frpc" >> $GITHUB_ENV
          echo "DOCKERFILE_FRPS_PATH=dockerfiles/Dockerfile-for-frps" >> $GITHUB_ENV
          echo "TAG_FRPC=registry.cn-hangzhou.aliyuncs.com/xczns/frpc:${{ env.TAG_NAME }}" >> $GITHUB_ENV
          echo "TAG_FRPS=registry.cn-hangzhou.aliyuncs.com/xczns/frps:${{ env.TAG_NAME }}" >> $GITHUB_ENV

      - name: 构建并推送frpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frpc
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ env.TAG_FRPC }}

      - name: 构建并推送frps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frps
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ env.TAG_FRPS }}